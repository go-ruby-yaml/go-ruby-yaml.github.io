baseURL = "https://go-ruby-yaml.github.io/"
title = "go-ruby-yaml"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

[[params.phases]]
  name = "Scanner & parser"
  status = "ready"
  blurb = "A YAML 1.1 scanner and parser following Psych's event model — documents, mappings, sequences, scalars in plain / single / double / literal / folded styles, and the directive and document markers."
[[params.phases]]
  name = "Dump emitter"
  status = "ready"
  blurb = "`Dump(v)` emits Psych-compatible YAML: block style by default with flow where Psych uses it, correct scalar quoting, and stable key ordering — matching reference Ruby's output byte-for-byte."
[[params.phases]]
  name = "Load & SafeLoad"
  status = "ready"
  blurb = "`Load(s)` builds the full Ruby value graph; `SafeLoad` restricts to the safe scalar/collection subset, refusing arbitrary `!ruby/object:` instantiation exactly as Psych's safe loader does."
[[params.phases]]
  name = "Anchors, aliases & Ruby tags"
  status = "ready"
  blurb = "Anchors `&a` and aliases `*a` for shared and cyclic structure, plus the `!ruby/object:`, `!ruby/symbol`, `!ruby/range` and related tags round-tripped the way Psych writes and reads them."
[[params.phases]]
  name = "Ruby scalar types"
  status = "ready"
  blurb = "`Symbol`, `Time`, `Range` and arbitrary-precision bignum scalars emitted and parsed with Psych's tag and formatting conventions."
[[params.phases]]
  name = "yaml-test-suite conformant"
  status = "ready"
  blurb = "The loader passes the full [yaml-test-suite](https://github.com/yaml/yaml-test-suite) accept/reject axis — **402 / 402**: **308 / 308** well-formed documents load and **94 / 94** ill-formed inputs are rejected (0 panics, 0 known gaps). Every case runs on every lane, held by a regression ratchet."
[[params.phases]]
  name = "Differential oracle & coverage"
  status = "ready"
  blurb = "A wide value corpus dumped and loaded both here and by the system `ruby`/Psych, compared byte-for-byte; 100% coverage, gofmt + go vet clean, green across all six 64-bit Go arches and three OSes."

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 10.02:1, bright on the dark background 4.00:1.
  base = "#7f1d1d"
  deep = "#4d1212"
  bright = "#dc2626"
  shadow = "rgba(127,29,29,.7)"
  glow = "rgba(127,29,29,.6)"
  wash = "rgba(127,29,29,.10)"
  washDeep = "rgba(77,18,18,.06)"
  chipBg = "#fbe5e5"
  chipBorder = "#f4bebe"
  chipFg = "#4d1212"
  chipBgDark = "rgba(220,38,38,.14)"
  chipBorderDark = "rgba(220,38,38,.32)"
  chipFgDark = "#ec8888"
  statsEnd = "#f7cbcb"
  bandText = "#f9dcdc"
